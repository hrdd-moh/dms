<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធគ្រប់គ្រងការងារ និងឯកសារឌីជីថល V2.5 - HRDD ក្រសួងសុខាភិបាល</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;500;600;700&family=Moul&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="./css/custom.css">
</head>
<body class="bg-[#f4f7f6] text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

  <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2"></div>

  <!-- APP SHELL -->
  <div id="app-shell" class="hidden flex-1 flex h-full overflow-hidden">
    <!-- SIDEBAR -->
    <aside id="app-sidebar" class="w-72 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 z-30 shadow-xs hidden lg:flex">
      <div class="flex flex-col flex-1 overflow-y-auto">
        <div class="h-20 px-4 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="h-12 w-12 rounded-xl border border-emerald-600/25 p-0.5 flex items-center justify-center bg-emerald-50">
              <img src="Logo MOH_Ok_Background.png" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=MoH&background=059669&color=fff'" alt="Logo" class="h-full w-full object-contain">
            </div>
            <div>
              <span class="font-extrabold text-slate-900 text-base">HRDD DMS</span>
              <p class="text-xs text-slate-500 font-semibold">ក្រសួងសុខាភិបាល</p>
            </div>
          </div>
        </div>

        <div class="p-3.5 border-b border-slate-100 bg-emerald-50/40 space-y-1.5">
          <label class="block text-[11px] text-emerald-900 font-bold">🏛️ ការិយាល័យប្រតិបត្តិការ៖</label>
          <select id="active-bureau-select" onchange="window.app.changeActiveBureau(this.value)" class="w-full bg-white text-emerald-950 text-xs font-bold border border-emerald-300 rounded-xl p-2 outline-none">
            <option value="bureau_1">១. ការិយាល័យបណ្តុះបណ្តាលមុនពេលបម្រើការងារ</option>
            <option value="bureau_2">២. ការិយាល័យបណ្តុះបណ្តាលបន្ត</option>
            <option value="bureau_3">៣. ការិយាល័យចុះបញ្ជិកា និងវិញ្ញាបនបត្រ</option>
          </select>
        </div>

        <div class="p-3 space-y-1" id="bureau-tabs-nav"></div>
      </div>
      <div class="p-3 border-t bg-slate-50">
        <button onclick="window.app.handleLogout()" class="w-full py-2 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold">🚪 ចាកចេញ</button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col h-full min-w-0 overflow-hidden">
      <header class="h-16 bg-white border-b px-6 flex items-center justify-between shrink-0">
        <h1 class="text-sm font-bold text-slate-900" id="active-bureau-title">ការិយាល័យជំនាញ</h1>
        <div class="flex items-center gap-3">
          <span class="text-xs font-bold" id="current-user-fullname">មន្ត្រី</span>
        </div>
      </header>
      <main class="flex-1 overflow-y-auto p-6 space-y-5">
        <div id="section-docs" class="bg-white rounded-3xl border border-slate-200 p-5 space-y-4">
          <h3 class="text-base font-bold">📚 បណ្ណាល័យឯកសាររួម</h3>
          <div class="border rounded-2xl overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-emerald-50 text-emerald-900 font-bold">
                <tr><th class="p-3">Doc ID</th><th class="p-3">ចំណងជើង</th><th class="p-3">ប្រភេទ</th></tr>
              </thead>
              <tbody id="docs-table-body" class="divide-y"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div id="modal-login" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl space-y-4 text-center">
      <h3 class="text-base font-bold text-slate-900">ចូលប្រព័ន្ធ V2.5 (Multi-File)</h3>
      <form onsubmit="window.app.handleLogin(event)" class="space-y-3.5 text-left">
        <div><label class="block text-xs font-bold text-slate-700 mb-1">Username</label><input type="text" id="login-username" required class="w-full border rounded-xl p-2.5 text-xs bg-slate-50" placeholder="admin ឬ user1"></div>
        <div><label class="block text-xs font-bold text-slate-700 mb-1">Password</label><input type="password" id="login-password" required class="w-full border rounded-xl p-2.5 text-xs bg-slate-50" placeholder="123"></div>
        <p id="login-error" class="text-xs text-rose-600 font-medium hidden">ឈ្មោះគណនី ឬលេខសម្ងាត់មិនត្រឹមត្រូវ!</p>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">ចូលប្រព័ន្ធ (Sign In)</button>
      </form>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
